<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كتالوج العطور — عرض فقط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1a100d;
    --bg-2: #221512;
    --panel: #271815;
    --panel-2: #2e1c17;
    --line: rgba(201,161,90,0.18);
    --gold: #c9a15a;
    --gold-light: #e8cd94;
    --ivory: #f4ead9;
    --muted: #ab9686;

    --floral: #c17b8f;
    --citrus: #d9a441;
    --woody: #8a6a45;
    --oud: #7a4a3d;
    --fresh: #6f9484;
    --oriental: #a5613f;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: radial-gradient(ellipse at top, #2a1a15 0%, #150d0b 70%);
    color: var(--ivory);
    font-family: 'Tajawal', sans-serif;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  ::selection{ background: var(--gold); color: #1a100d; }

  /* ---------- Ambient particles ---------- */
  #particles{
    position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
  }
  .mote{
    position: absolute; bottom: -10px; width: 4px; height: 4px; border-radius: 50%;
    background: var(--gold-light); opacity: 0.35; filter: blur(0.5px);
    animation: drift linear infinite;
  }
  @keyframes drift{
    0%{ transform: translateY(0) translateX(0); opacity: 0; }
    10%{ opacity: 0.5; }
    90%{ opacity: 0.3; }
    100%{ transform: translateY(-110vh) translateX(20px); opacity: 0; }
  }

  /* ---------- Hero ---------- */
  .hero{
    position: relative; z-index: 1;
    padding: 72px 24px 56px;
    text-align: center;
    border-bottom: 1px solid var(--line);
  }
  .hero-inner{ max-width: 760px; margin: 0 auto; }
  .eyebrow{
    font-size: 13px; letter-spacing: 3px; color: var(--gold);
    text-transform: uppercase; margin: 0 0 14px;
    font-weight: 500;
  }
  .hero h1{
    font-family: 'Aref Ruqaa', serif;
    font-size: clamp(40px, 7vw, 68px);
    margin: 0 0 18px;
    font-weight: 700;
    color: var(--ivory);
    line-height: 1.15;
  }
  .hero h1 span{ color: var(--gold-light); }
  .tagline{
    color: var(--muted); font-size: 16px; line-height: 1.9;
    max-width: 520px; margin: 0 auto 30px;
  }
  .btn{
    font-family: 'Tajawal', sans-serif;
    border: none; cursor: pointer; border-radius: 999px;
    padding: 12px 26px; font-size: 14.5px; font-weight: 700;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn-outline{
    background: transparent; color: var(--gold-light);
    border: 1px solid var(--gold);
  }
  .btn-outline:hover{ background: rgba(201,161,90,0.1); }
  .btn-outline.active{ background: var(--gold); color: #1a100d; }
  .btn-gold{
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    color: #241510; box-shadow: 0 6px 18px rgba(201,161,90,0.25);
  }
  .btn-gold:hover{ box-shadow: 0 8px 22px rgba(201,161,90,0.4); }
  .btn-ghost{
    background: transparent; color: var(--muted); border: 1px solid var(--line);
  }
  .btn-ghost:hover{ color: var(--ivory); border-color: var(--gold); }

  /* ---------- Main / toolbar ---------- */
  main{ position: relative; z-index: 1; max-width: 1160px; margin: 0 auto; padding: 40px 24px 90px; }

  .toolbar{
    display:flex; flex-wrap: wrap; align-items:center; gap: 14px;
    margin-bottom: 30px;
  }
  #searchInput{
    flex: 1 1 220px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ivory);
    padding: 12px 18px;
    border-radius: 999px;
    font-family: inherit; font-size: 14.5px;
    outline: none;
  }
  #searchInput::placeholder{ color: var(--muted); }
  #searchInput:focus{ border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,161,90,0.15); }

  .chips{ display:flex; flex-wrap:wrap; gap: 8px; }
  .chip{
    padding: 9px 16px; border-radius: 999px; font-size: 13.5px; cursor:pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    transition: all .15s ease; white-space: nowrap;
  }
  .chip:hover{ color: var(--ivory); }
  .chip.active{ color: #1a100d; border-color: transparent; }

  .hidden{ display: none !important; }

  /* ---------- Grid / cards ---------- */
  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 22px;
  }
  .card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    position: relative;
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .card:hover{ transform: translateY(-4px); border-color: var(--gold); box-shadow: 0 16px 34px rgba(0,0,0,0.35); }

  .card-top{
    position: relative;
    height: 168px;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 20%, var(--fam-light, #3a2620), var(--fam-dark, #1c130f));
  }
  .card-top svg{ width: 68px; height: 110px; filter: drop-shadow(0 8px 14px rgba(0,0,0,0.45)); transition: transform .3s ease; }
  .card:hover .card-top svg{ transform: translateY(-4px) scale(1.03); }

  .fam-badge{
    position: absolute; top: 12px; right: 12px;
    font-size: 11.5px; padding: 5px 12px; border-radius: 999px;
    background: rgba(0,0,0,0.35); color: var(--ivory);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(2px);
  }

  .card-body{ padding: 18px 20px 20px; }
  .card-brand{
    font-size: 11.5px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--gold); margin: 0 0 4px; font-weight: 700;
  }
  .card-name{
    font-family: 'Aref Ruqaa', serif; font-size: 24px; margin: 0 0 8px; color: var(--ivory);
  }
  .card-desc{
    font-size: 13.5px; color: var(--muted); line-height: 1.7; margin: 0 0 14px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-foot{
    display:flex; align-items:center; justify-content: space-between;
    margin-bottom: 6px;
  }
  .price{ color: var(--gold-light); font-weight: 700; font-size: 16px; }
  .size{ color: var(--muted); font-size: 12.5px; }

  .expand-btn{
    width:100%; text-align:center; background:none; border:none; cursor:pointer;
    color: var(--muted); font-size: 12.5px; padding: 8px 0 0; font-family: inherit;
    border-top: 1px dashed var(--line); margin-top: 8px;
  }
  .expand-btn:hover{ color: var(--gold-light); }

  .pyramid{
    max-height: 0; overflow: hidden; transition: max-height .35s ease;
  }
  .card.open .pyramid{ max-height: 260px; }
  .pyr-row{ padding: 10px 0 0; }
  .pyr-label{ font-size: 11px; color: var(--muted); letter-spacing: 1.5px; margin-bottom: 6px; }
  .tags{ display:flex; flex-wrap:wrap; gap: 6px; }
  .tag{
    font-size: 11.5px; padding: 4px 10px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ivory);
  }

  .empty{ text-align:center; color: var(--muted); padding: 60px 20px; font-size: 15px; }

  footer{
    position: relative; z-index: 1; text-align:center; padding: 20px; color: var(--muted); font-size: 12.5px;
  }
  @media (max-width: 480px){
    .hero{ padding: 56px 18px 40px; }
  }

  .card-photo{
    width:100%; height:168px; object-fit:cover; display:block;
    background:radial-gradient(circle at 50% 20%, var(--fam-light,#3a2620), var(--fam-dark,#1c130f));
  }
  .photo-placeholder{
    width:100%; height:168px; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 20%, var(--fam-light,#3a2620), var(--fam-dark,#1c130f));
  }
</style>

</head>
<body>

<div id="particles"></div>

<header class="hero">
  <div class="hero-inner">
    <p class="eyebrow">دار العطور الخاصة</p>
    <h1>كتالوج <span>العطور</span></h1>
    <p class="tagline">تشكيلة مختارة من العطور — من الحمضيات المنعشة إلى دفء العود الشرقي. اضغطي على أي عطر لاستكشاف هرم روائحه.</p>
  </div>
</header>

<main>
  <div class="toolbar">
    <input id="searchInput" type="text" placeholder="ابحثي عن اسم العطر أو الدار...">
    <div class="chips" id="familyChips"></div>
  </div>

  <div class="grid" id="grid"></div>
  <p id="emptyState" class="empty hidden">لا توجد عطور مطابقة لبحثك. جرّبي كلمة أخرى أو أضيفي عطرًا جديدًا.</p>
</main>

<footer>
  كتالوج العطور — عرض المنتجات والأسعار والتفاصيل فقط.
</footer>


<script>
(function(){
  const FAMILIES = {
    floral:   { label: 'زهري',  color: '#c17b8f' },
    citrus:   { label: 'حمضي',  color: '#d9a441' },
    woody:    { label: 'خشبي',  color: '#8a6a45' },
    oud:      { label: 'عودي',  color: '#7a4a3d' },
    fresh:    { label: 'منعش',  color: '#6f9484' },
    oriental: { label: 'شرقي',  color: '#a5613f' }
  };

  const DEFAULT_DATA = [
    { id: 'p1', name: 'ليالي الشرق', brand: 'دار الأصالة', family: 'oud', price: '450 ر.س', size: '50 مل',
      desc: 'عود دافئ ممزوج بالعنبر، لحضور لا يُنسى في السهرات الشتوية.',
      top: 'هيل، برتقال', heart: 'ورد تعزي، زعفران', base: 'عود، عنبر، مسك' },
    { id: 'p2', name: 'نسيم الياسمين', brand: 'بيت الزهور', family: 'floral', price: '290 ر.س', size: '75 مل',
      desc: 'باقة زهرية بيضاء ناعمة، تفتح بلمسة فاكهية وتستقر على خشب هادئ.',
      top: 'كمثرى، برغموت', heart: 'ياسمين، زنبق', base: 'خشب الصندل، مسك أبيض' },
    { id: 'p3', name: 'صباح الحمضيات', brand: 'أتيليه الساحل', family: 'citrus', price: '210 ر.س', size: '100 مل',
      desc: 'انطلاقة منعشة من الليمون والبرتقال، مثالية لأيام الصيف الحارة.',
      top: 'ليمون، يوزو، نعناع', heart: 'زهر البرتقال', base: 'مسك أبيض، كدر' },
    { id: 'p4', name: 'همسة العنبر', brand: 'دار الأصالة', family: 'oriental', price: '380 ر.س', size: '50 مل',
      desc: 'توليفة شرقية غامضة من التوابل الدافئة والعنبر الحلو.',
      top: 'قرفة، فلفل وردي', heart: 'زنجبيل، ورد', base: 'عنبر، فانيليا، جلد' },
    { id: 'p5', name: 'غابة الأرز', brand: 'أتيليه الساحل', family: 'woody', price: '260 ر.س', size: '75 مل',
      desc: 'خشبي جاف وأنيق، يستحضر هدوء الغابات في المساء.',
      top: 'خزامى، طرخون', heart: 'خشب الأرز، جوز الطيب', base: 'فيتيفر، خشب الصندل' },
    { id: 'p6', name: 'قطرة ندى', brand: 'بيت الزهور', family: 'fresh', price: '230 ر.س', size: '100 مل',
      desc: 'إحساس مائي منعش كأنك في نزهة صباحية قرب البحر.',
      top: 'خيار، نعناع مائي', heart: 'زهر الياسمين المائي', base: 'مسك، عنبر خفيف' }
  ];

  let data = [];
  let activeFamily = 'all';
  let searchTerm = '';

  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('emptyState');
  const familyChips = document.getElementById('familyChips');
  const searchInput = document.getElementById('searchInput');

  // ---------- particles ----------
  function spawnParticles(){
    const wrap = document.getElementById('particles');
    for(let i=0;i<24;i++){
      const m = document.createElement('div');
      m.className = 'mote';
      m.style.left = Math.random()*100 + 'vw';
      m.style.animationDuration = (14 + Math.random()*14) + 's';
      m.style.animationDelay = (Math.random()*14) + 's';
      wrap.appendChild(m);
    }
  }

  // ---------- catalogue data (display only) ----------
  function loadData(){
    data = DEFAULT_DATA.slice();
  }

  // ---------- svg bottle ----------
  function bottleSVG(color){
    return `<svg viewBox="0 0 60 100" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="4" width="12" height="10" rx="2" fill="${color}" opacity="0.9"/>
      <rect x="26" y="0" width="8" height="6" rx="1.5" fill="#d8c39a"/>
      <path d="M18 18 h24 c3 0 5 2 5 5 v55 c0 8 -7 14 -17 14 s-17 -6 -17 -14 v-55 c0 -3 2 -5 5 -5 z"
        fill="${color}" fill-opacity="0.22" stroke="${color}" stroke-width="1.5"/>
      <path d="M18 40 h24 v33 c0 8 -7 14 -12 14 s-12 -6 -12 -14 z" fill="${color}" fill-opacity="0.55"/>
      <rect x="22" y="24" width="16" height="10" rx="2" fill="#ffffff" fill-opacity="0.12"/>
    </svg>`;
  }

  // ---------- chips ----------
  function renderChips(){
    let html = `<div class="chip ${activeFamily==='all'?'active':''}" data-fam="all" style="${activeFamily==='all' ? 'background:var(--gold)' : ''}">الكل</div>`;
    Object.keys(FAMILIES).forEach(key=>{
      const f = FAMILIES[key];
      const active = activeFamily === key;
      html += `<div class="chip ${active?'active':''}" data-fam="${key}" style="${active ? 'background:'+f.color : ''}">${f.label}</div>`;
    });
    familyChips.innerHTML = html;
    familyChips.querySelectorAll('.chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        activeFamily = chip.dataset.fam;
        renderChips();
        renderGrid();
      });
    });
  }

  // ---------- grid ----------
  function renderGrid(){
    const term = searchTerm.trim().toLowerCase();
    const filtered = data.filter(p=>{
      const famOk = activeFamily === 'all' || p.family === activeFamily;
      const text = (p.name + ' ' + p.brand).toLowerCase();
      const termOk = !term || text.includes(term);
      return famOk && termOk;
    });

    if(filtered.length === 0){
      grid.innerHTML = '';
      emptyState.classList.remove('hidden');
      return;
    }
    emptyState.classList.add('hidden');

    grid.innerHTML = filtered.map(p=>{
      const fam = FAMILIES[p.family] || FAMILIES.floral;
      return `
      <div class="card" data-id="${p.id}">
        <div class="card-top" style="--fam-light:${fam.color}66; --fam-dark:#1c130f;">
          <div class="fam-badge">${fam.label}</div>
          ${p.image ? `<img class="card-photo" src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}">` : `<div class="photo-placeholder">${bottleSVG(fam.color)}</div>`}
        </div>
        <div class="card-body">
          <p class="card-brand">${escapeHtml(p.brand)}</p>
          <h3 class="card-name">${escapeHtml(p.name)}</h3>
          <p class="card-desc">${escapeHtml(p.desc||'')}</p>
          <div class="card-foot">
            <span class="price">${escapeHtml(p.price||'')}</span>
            <span class="size">${escapeHtml(p.size||'')}</span>
          </div>
          <button class="expand-btn">هرم الرائحة ▾</button>
          <div class="pyramid">
            ${pyrRow('مقدمة', p.top)}
            ${pyrRow('قلب', p.heart)}
            ${pyrRow('قاعدة', p.base)}
          </div>
        </div>
      </div>`;
    }).join('');

    grid.querySelectorAll('.expand-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.currentTarget.closest('.card').classList.toggle('open');
      });
    });
  }

  function pyrRow(label, val){
    if(!val) return '';
    const tags = val.split('،').join(',').split(',').map(s=>s.trim()).filter(Boolean);
    if(tags.length===0) return '';
    return `<div class="pyr-row">
      <div class="pyr-label">${label}</div>
      <div class="tags">${tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
    </div>`;
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s=>({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[s]));
  }

  searchInput.addEventListener('input', (e)=>{
    searchTerm = e.target.value;
    renderGrid();
  });

  (async function init(){
    spawnParticles();
    renderChips();
    await loadData();
    renderGrid();
  })();
})();
</script>
</body>
</html>
